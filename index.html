<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Track - Seguimiento GPS</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar"><div class="brand">ELTA</div><div class="version">Versión 1.4.38</div></header>
  <section class="hero"><img src="elta-logo.png" class="logo" alt="ELTA"><h1>Track - Seguimiento GPS</h1></section>
  <nav class="tabs">
    <button id="btn-inicio" onclick="show('inicio')" class="active">🚚 Inicio / Fin</button>
    <button id="btn-tracking" onclick="show('tracking')">📍 Tracking</button>
    <button id="btn-alertas" onclick="show('alertas')">⚠️ Alertas</button>
    <button id="btn-clima" onclick="show('clima')">🌦️ Clima</button>
    <button id="btn-usuario" onclick="show('usuario')">👤 Usuario</button>
    <button id="btn-ultimo" onclick="show('ultimo')">📋 Último</button>
  </nav>
  <main>
    <section id="inicio" class="view"><div class="card">
      
      <label>Flota - Chofer</label><input id="inicioUser" readonly placeholder="Cargar usuario">
      <label>Cliente</label><select id="clienteSelect" onchange="onClienteChange()"></select>
      <label>Origen</label><select id="origenSelect" onchange="onOrigenDestinoChange()"></select>
      <label>Destino</label><select id="destinoSelect" onchange="onOrigenDestinoChange()"></select>
      <label>Número de Lote / Carga</label><input id="lote" placeholder="Ej: 1234">
      <div id="rutaInfo" class="infoBox compactRouteInfo"></div>
      <div class="inicioActions"><button class="btn compactBtn" onclick="iniciarTransito()">Iniciar tránsito</button><button class="btn danger compactBtn" onclick="cerrarTransito()">Cierre tránsito</button></div>
    </div></section>
    <section id="tracking" class="view hidden"><div class="card trackingCard">
      <div id="realMap" class="realMap"></div>

      <div class="mapLegend compactLegend">
        <span><b class="dot origin"></b>Origen</span>
        <span><b class="dot current"></b>GPS</span>
        <span><b class="dot dest"></b>Destino</span>
        <span><b class="dot alert"></b>Alertas</span>
      </div>

      <div id="trackingBox" class="trackingStats compactStats"></div>

      <div class="trackingActions bottomActions">
        <button class="btn secondary compactBtn" onclick="actualizarGps()">Actualizar GPS</button>
        <button class="btn compactBtn" onclick="enviarActualizacion()">Enviar actualización</button>
      </div>
    </div></section>
    <section id="alertas" class="view hidden"><div class="card">
      
      <label>Tipo de alerta</label><select id="alertType"><option>Control de carga</option><option>Ingreso Aduana</option><option>Salida Aduana</option><option>Liberación Aduana</option><option>Accidente</option><option>Paso Cortado</option><option>Niebla</option><option>Rotura</option><option>Otros</option></select>
      <button class="btn warning" onclick="registrarAlerta()">Registrar alerta con GPS</button>
      <div id="alertList" class="summary"></div>
    </div></section>
    <section id="clima" class="view hidden"><div class="card climaCard climaCardNew">
      <div id="weatherNow" class="weatherCardNew">
        <div class="weatherIconBig">🌤️</div>
        <div class="weatherMainNew">
          <div class="weatherTempNew">--°</div>
          <div class="weatherDescNew">Presioná actualizar</div>
          <div id="weatherLocation" class="weatherLocNew">Según posición GPS</div>
        </div>
      </div>
      <div class="forecastCardNew">
        
        <div id="weatherForecast" class="forecastListNew"></div>
      </div>
      <div class="passCardNew">
        <div class="passTitleNew">🚛 Pasos Fronterizos</div>
        <div id="passStatus" class="passStatusNew">Estado pendiente de actualizar.</div>
      </div>
      <div class="passAlertCardNew">
        
        <div id="passAlerts" class="passAlertsNew">Sin datos actualizados.</div>
      </div>
      <button class="btn weatherFullBtn" onclick="actualizarClima()">🔄 Actualizar clima y paso</button>
    </div></section>

    <section id="usuario" class="view hidden"><div class="card">
      
      <label>Número de Flota</label><input id="userFleet" placeholder="Ej: 105">
      <label>Nombre de chofer</label><input id="userDriver" placeholder="Ej: Ganin">
      <label>Teléfono WhatsApp</label><textarea id="userPhones" placeholder="Ej: 54911..."></textarea>
      <button class="btn" onclick="saveUser()">Guardar usuario</button><div id="userMsg"></div>
    </div></section>
    <section id="ultimo" class="view hidden"><div class="card">
      <div id="lastBox" class="summary"></div><button class="btn" onclick="reenviarUltimo()">Reenviar información</button>
    </div></section>
  </main>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="data.js"></script><script src="app.js"></script>
</body></html>
