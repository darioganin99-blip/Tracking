<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Track-POD seguimiento GPS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar"><div class="brand">ELTA</div><div class="version">Versión 1.4.4</div></header>
  <section class="hero"><img src="elta-logo.png" class="logo" alt="ELTA"><h1>Track-POD seguimiento GPS</h1></section>
  <nav class="tabs">
    <button id="btn-inicio" onclick="show('inicio')" class="active">🚚 Inicio / Fin</button>
    <button id="btn-tracking" onclick="show('tracking')">📍 Tracking</button>
    <button id="btn-alertas" onclick="show('alertas')">⚠️ Alertas</button>
    <button id="btn-usuario" onclick="show('usuario')">👤 Usuario</button>
    <button id="btn-ultimo" onclick="show('ultimo')">📋 Último</button>
  </nav>
  <main>
    <section id="inicio" class="view"><div class="card">
      <h2>Inicio / Fin de tránsito</h2>
      <label>Flota - Chofer</label><input id="inicioUser" readonly placeholder="Cargar usuario">
      <label>Cliente</label><select id="clienteSelect" onchange="onClienteChange()"></select>
      <label>Origen</label><select id="origenSelect" onchange="onOrigenDestinoChange()"></select>
      <label>Destino</label><select id="destinoSelect" onchange="onOrigenDestinoChange()"></select>
      <label>Número de Lote / Carga</label><input id="lote" placeholder="Ej: 1234">
      <div id="rutaInfo" class="infoBox"></div>
      <button class="btn" onclick="iniciarTransito()">Iniciar tránsito</button>
      <button class="btn danger" onclick="cerrarTransito()">Cierre tránsito</button>
    </div></section>
    <section id="tracking" class="view hidden"><div class="card">
      <h2>Tracking</h2><div id="trackingBox" class="summary"></div>
      <div class="routeBox"><div class="routeLine"><span id="routeProgress"></span></div><div class="routeLabels"><span>Origen</span><span>Destino</span></div></div>
      <div id="chileBox" class="infoBox hidden"></div>
      <button class="btn secondary" onclick="actualizarGps()">Actualizar GPS</button>
      <button class="btn" onclick="enviarActualizacion()">Enviar actualización de tránsito</button>
    </div></section>
    <section id="alertas" class="view hidden"><div class="card">
      <h2>Alertas</h2>
      <label>Tipo de alerta</label><select id="alertType"><option>Control de carga</option><option>Ingreso Aduana</option><option>Liberación Aduana</option><option>Accidente</option><option>Paso Cortado</option><option>Niebla</option><option>Rotura</option><option>Otros</option></select>
      <label>Detalle</label><textarea id="alertDetail" placeholder="Comentario opcional"></textarea>
      <button class="btn warning" onclick="registrarAlerta()">Registrar alerta con GPS</button>
      <div id="alertList" class="summary"></div>
    </div></section>
    <section id="usuario" class="view hidden"><div class="card">
      <h2>Usuario</h2>
      <label>Número de Flota</label><input id="userFleet" placeholder="Ej: 105">
      <label>Nombre de chofer</label><input id="userDriver" placeholder="Ej: Ganin">
      <label>Teléfonos o grupo WhatsApp</label><textarea id="userPhones" placeholder="Uno o más teléfonos separados por coma. Ej: 54911...,54911..."></textarea>
      <button class="btn" onclick="saveUser()">Guardar usuario</button><div id="userMsg"></div>
    </div></section>
    <section id="ultimo" class="view hidden"><div class="card">
      <h2>Último envío</h2><div id="lastBox" class="summary"></div><button class="btn" onclick="reenviarUltimo()">Reenviar información</button>
    </div></section>
  </main>
  <script src="data.js"></script><script src="app.js"></script>
</body></html>
